services:
  # React frontend — free static site on Render's CDN
  - type: web
    name: joey-haas-dev
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # set this in the Render dashboard to the API service URL

  # Python API — free tier (spins down when idle; upgrade plan to remove)
  - type: web
    name: joey-haas-dev-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # Set in the Render dashboard. sync: false keeps values out of the repo.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional hardening; set after the first successful sign-in.
      - key: ADMIN_GOOGLE_SUB
        sync: false
      # Neon Postgres. Not interchangeable: the app uses the pooled hostname,
      # Alembic the direct one. See README -> Database.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      # Media tracker. Unlike everything above, these are optional and checked
      # lazily: a missing one disables that media type rather than stopping the
      # service. Declared here anyway so the Blueprint remains the record of
      # which variables the service expects. See backend/sources/README.md.
      - key: TMDB_API_TOKEN
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: COMICVINE_API_KEY
        sync: false
      # Photo import, and later the recommendation engine.
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
