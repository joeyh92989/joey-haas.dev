services:
  # React frontend — free static site on Render's CDN
  - type: web
    name: joey-haas-dev
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    # Render serves dist/about/index.html at /about/ but not at /about: there
    # the catch-all wins, and the prerendered head (frontend/scripts/
    # prerender.mjs) is lost. These name each prerendered page's file, ahead
    # of the catch-all. Keep them in step with publicRoutes in
    # prerender-lib.mjs (prerender-lib.test.mjs checks). An existing file is
    # served before any rule, so /about/ and the assets are unaffected.
    # No placeholders: a rewrite to a file the build did not write (a draft,
    # a mistyped slug) serves an empty 200, not the SPA (seen on 2026-10-19
    # with /blog/:slug), so each published post gets its own rule. Item and
    # year pages change between deploys and stay on the catch-all.
    # Don't add a slash with a redirect (/spine/:id -> /spine/:id/): Render
    # matches the slash form against the same source and loops for any path
    # without a file (probed on production, 2026-10-19).
    routes:
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /projects
        destination: /projects/index.html
      - type: rewrite
        source: /spine
        destination: /spine/index.html
      - type: rewrite
        source: /spine/next
        destination: /spine/next/index.html
      - type: rewrite
        source: /now
        destination: /now/index.html
      - type: rewrite
        source: /colophon
        destination: /colophon/index.html
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      - type: rewrite
        source: /blog/how-spine-works
        destination: /blog/how-spine-works/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # set this in the Render dashboard to the API service URL

  # Python API — free tier (spins down when idle; upgrade plan to remove)
  - type: web
    name: joey-haas-dev-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Render routes a new deploy's traffic only after this answers 2xx, and
    # restarts an instance that fails it for 60 seconds. /api/health touches
    # no database, so a sleeping Neon cannot fail it; a boot that refuses the
    # schema never answers it, so a bad deploy is cancelled rather than live.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # Set in the Render dashboard. sync: false keeps values out of the repo.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional hardening; set after the first successful sign-in.
      - key: ADMIN_GOOGLE_SUB
        sync: false
      # Neon Postgres. Not interchangeable: the app uses the pooled hostname,
      # Alembic the direct one. See README -> Database.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      # Media tracker. Unlike everything above, these are optional and checked
      # lazily: a missing one disables that media type rather than stopping the
      # service. Declared here anyway so the Blueprint remains the record of
      # which variables the service expects. See backend/sources/README.md.
      - key: TMDB_API_TOKEN
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: COMICVINE_API_KEY
        sync: false
      # Photo import, and later the recommendation engine.
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The nightly workflow's bearer token (.github/workflows/nightly.yml).
      # Opens only items.JOB_ROUTES. Unset: the job's calls are 401s.
      - key: JOB_TOKEN
        sync: false
