services:
  # React frontend — free static site on Render's CDN
  - type: web
    name: personal-site
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # set this in the Render dashboard to the API service URL

  # Python API — free tier (spins down when idle; upgrade plan to remove)
  - type: web
    name: personal-site-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # Set in the Render dashboard. sync: false keeps values out of the repo.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional hardening; set after the first successful sign-in.
      - key: ADMIN_GOOGLE_SUB
        sync: false
