<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joey Haas</title>
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Joey Haas"
      href="/feed.xml"
    />
    <!--
      Dark is the brand default, so it is baked into the markup above rather
      than applied by script: with JavaScript unavailable the page still gets
      the dark palette, and the Shiki rules keyed on [data-theme='dark'] still
      match. This script therefore only ever switches to the stored preference,
      and runs before first paint so the switch is invisible.
    -->
    <script>
      try {
        var stored = localStorage.getItem('theme')
        if (stored === 'light' || stored === 'dark')
          document.documentElement.dataset.theme = stored
      } catch (error) {
        // Storage can throw in private browsing; the markup default stands.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
