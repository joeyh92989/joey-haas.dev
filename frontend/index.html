<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joey Haas</title>
    <meta
      name="description"
      content="Joey Haas is a senior software engineer in Denver building payments and ledger systems, and Spine, a tracker for a physical game collection."
    />
    <!--
      Link previews. Crawlers do not run JavaScript, so these are static and
      site-wide; per-route meta would need prerendering.
    -->
    <meta property="og:title" content="Joey Haas" />
    <meta
      property="og:description"
      content="Joey Haas is a senior software engineer in Denver building payments and ledger systems, and Spine, a tracker for a physical game collection."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://joey-haas.dev/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Joey Haas, senior software engineer, and Spine, a tracker for my physical game collection."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Joey Haas"
      href="/feed.xml"
    />
    <!--
      Dark is the brand default, so it is baked into the markup above rather
      than applied by script: with JavaScript unavailable the page still gets
      the dark palette, and the Shiki rules keyed on [data-theme='dark'] still
      match. This script therefore only ever switches to the stored preference,
      and runs before first paint so the switch is invisible.
    -->
    <script>
      try {
        var stored = localStorage.getItem('theme')
        if (stored === 'light' || stored === 'dark')
          document.documentElement.dataset.theme = stored
      } catch (error) {
        // Storage can throw in private browsing; the markup default stands.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
