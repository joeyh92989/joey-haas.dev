[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.19 deprecates the legacy space/comma/colon splitting.
path_separator = os

# The URL is supplied by migrations/env.py from DATABASE_URL_DIRECT rather than
# written here, so no credential ever enters a tracked file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
