name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow reads code and reports status. It needs nothing else, so a
# compromised step has nothing worth taking.
permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant. Cancel it rather than
# paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the version Neon provisioned, so local, CI, and production
        # agree. A suite that passes against a different database than
        # production is not evidence.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches PYTHON_VERSION in render.yaml. macOS system Python is 3.9
          # and cannot install this dependency set at all.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      # Lint before tests: it is faster, and a formatting failure is cheaper to
      # report than a full test run.
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          # conftest.py turns an unreachable database into a hard error when CI
          # is set, so these tests can never silently skip here.
          CI: 'true'
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

      - name: Audit dependencies
        # The pinned set Render installs, not a fresh resolve of the ranges.
        run: pip-audit --requirement constraints.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 entered LTS 2026-08-26 and matches the development machine.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # The tests run against the built, prerendered dist, which is what ships,
      # not the dev server.
      - name: Build
        run: npm run build
        env:
          # vite.config.js refuses a build without Shelfle's salt; CI's
          # value only has to be non-empty.
          VITE_DAILY_SALT: ci

      - name: Audit dependencies
        # High and critical only. A moderate transitive advisory with no patch
        # would otherwise block every unrelated pull request until suppressed,
        # and a gate that must routinely be bypassed stops being a gate.
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node as the frontend job, so the build under test matches.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser binary is not part of the npm package. --with-deps adds
      # the system libraries Chromium needs on a bare runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e only: the browser tests need one page of each dynamic shelf route.
      # fetch-snapshot.mjs does nothing without an API URL and leaves
      # public/snapshot alone, so the synthetic snapshot (e2e/fixtures/README.md)
      # copied in first makes the build prerender them.
      - name: Use the fixture snapshot
        run: |
          mkdir -p public/snapshot
          cp e2e/fixtures/snapshot/*.json public/snapshot/

      - name: Build
        run: npm run build
        env:
          # vite.config.js refuses a build without Shelfle's salt; CI's
          # value only has to be non-empty.
          VITE_DAILY_SALT: ci

      - name: Run browser tests
        run: npm run e2e
        env:
          # Turns on forbidOnly and one retry in playwright.config.js, so a
          # stray test.only cannot pass CI and one flake is not a failure.
          CI: 'true'

      # The HTML report (with traces of failing tests) is only worth keeping
      # when something failed.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
