name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow reads code and reports status. It needs nothing else, so a
# compromised step has nothing worth taking.
permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant. Cancel it rather than
# paying for both. A push to main is different: deploy.yml waits for that
# commit's own backend and frontend jobs, so each main commit keeps its own run
# (grouped by SHA, never cancelled by the next merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The backend suite runs as two parallel jobs (`backend-tests`, and
  # `backend-migrations` for tests/test_migrations.py, about a fifth of the
  # run) behind one aggregate job named `backend`, because branch protection
  # requires a check called `backend`. Keep that name on the aggregate only.
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the version Neon provisioned, so local, CI, and production
        # agree. A suite that passes against a different database than
        # production is not evidence.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches PYTHON_VERSION in render.yaml. macOS system Python is 3.9
          # and cannot install this dependency set at all.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      # Lint before tests: it is faster, and a formatting failure is cheaper to
      # report than a full test run.
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # Everything but the migration tests, which run in backend-migrations.
      - name: Run tests
        env:
          # conftest.py turns an unreachable database into a hard error when CI
          # is set, so these tests can never silently skip here.
          CI: 'true'
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q --ignore=tests/test_migrations.py

      - name: Audit dependencies
        # The pinned set Render installs, not a fresh resolve of the ranges.
        run: pip-audit --requirement constraints.txt --no-deps --disable-pip

  # The migration chain tests (upgrade, downgrade, upgrade) on their own
  # Postgres: they drop and rebuild the schema, so a separate database also
  # keeps them from sharing one with the rest of the suite.
  # Keep the Postgres image, Python version and install in step with
  # backend-tests: the same pins, so both halves test what production runs.
  backend-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Run migration tests
        env:
          CI: 'true'
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/test_migrations.py

  # The required check. It passes only when both halves passed: `always()` so a
  # failed or cancelled half fails this job, not leaves it skipped (a skipped
  # required check reads as passing to branch protection).
  backend:
    needs: [backend-tests, backend-migrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both backend jobs passed
        env:
          TESTS: ${{ needs.backend-tests.result }}
          MIGRATIONS: ${{ needs.backend-migrations.result }}
        run: |
          echo "backend-tests: $TESTS; backend-migrations: $MIGRATIONS"
          [ "$TESTS" = success ] && [ "$MIGRATIONS" = success ]

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 entered LTS 2026-08-26 and matches the development machine.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # The tests run against the built, prerendered dist, which is what ships,
      # not the dev server.
      - name: Build
        run: npm run build
        env:
          # vite.config.js refuses a build without Shelfle's salt; CI's
          # value only has to be non-empty.
          VITE_DAILY_SALT: ci

      # An eager import of `cn` (tailwind-merge) adds ~30KB to every page.
      - name: Entry chunk has no tailwind-merge
        run: node scripts/check-entry-chunk.mjs

      - name: Audit dependencies
        # High and critical only. A moderate transitive advisory with no patch
        # would otherwise block every unrelated pull request until suppressed,
        # and a gate that must routinely be bypassed stops being a gate.
        # Shipped dependencies only (--omit=dev): since 2026-11-17 a ReDoS
        # advisory on picomatch (GHSA-fc5q-39xc-vjpf) covers every version and
        # has no patch, and picomatch reaches us only through dev tooling
        # (vite, vitest, eslint), none of it in the bundle. Drop --omit=dev
        # once a patched picomatch exists.
        run: npm audit --omit=dev --audit-level=high

  # The shell helpers' own tests, against a fake `gh` (no network, no secrets).
  # Not a required check: read it when scripts/ changes.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: merge-train tests
        run: ./scripts/merge-train.test.sh

      - name: wait-for-ci tests
        run: ./scripts/wait-for-ci.test.sh

  # Split (#598): a matrix of `e2e-shard` jobs behind one aggregate job named
  # `e2e`. Each is its own runner, so it builds the site itself. The split is
  # by FILE, not Playwright's blind --shard over the whole suite, because that
  # cuts the test list into equal COUNTS and one file (admin-add.spec.js, 192
  # slow tests, 10 minutes of the 20) made one shard take 15 minutes. So
  # admin-add is cut in quarters (desktop only, since its phone project is all
  # skips but one test, and the cut is by position in the file, whose slow tests
  # are in the second half: quarters 1 and 2 are fast and share add-1, 3 and 4
  # are the heavy ones; the phone project is the `extra` step of add-3), and `rest` runs everything else: it skips
  # admin-add through E2E_SKIP_FILES (playwright.config.js), so a new spec file
  # runs in `rest` by default and is never silently dropped.
  # --fully-parallel makes each test its own unit: safe here (no spec has a
  # beforeAll, serial mode or module state; every API answer is routed in the
  # page). fail-fast is off so one red shard does not cancel the others
  # mid-run: rerun the failed shard alone.
  e2e-shard:
    name: e2e-shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: add-1, args: 'admin-add.spec.js --project=desktop --shard=1/4', extra: 'admin-add.spec.js --project=desktop --shard=2/4', skip: '' }
          - { name: add-2, args: 'admin-add.spec.js --project=desktop --shard=3/4', extra: '', skip: '' }
          - { name: add-3, args: 'admin-add.spec.js --project=desktop --shard=4/4', extra: 'admin-add.spec.js --project=phone', skip: '' }
          - { name: rest, args: '', extra: '', skip: 'admin-add.spec.js' }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node as the frontend job, so the build under test matches.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser binary is not part of the npm package. --with-deps adds
      # the system libraries Chromium needs on a bare runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # e2e only: the browser tests need one page of each dynamic shelf route.
      # fetch-snapshot.mjs does nothing without an API URL and leaves
      # public/snapshot alone, so the synthetic snapshot (e2e/fixtures/README.md)
      # copied in first makes the build prerender them.
      - name: Use the fixture snapshot
        run: |
          mkdir -p public/snapshot
          cp e2e/fixtures/snapshot/*.json public/snapshot/

      - name: Build
        run: npm run build
        env:
          # vite.config.js refuses a build without Shelfle's salt; CI's
          # value only has to be non-empty.
          VITE_DAILY_SALT: ci

      - name: Run browser tests
        run: npm run e2e -- --fully-parallel ${{ matrix.args }}
        env:
          E2E_SKIP_FILES: ${{ matrix.skip }}
          # Turns on forbidOnly and one retry in playwright.config.js, so a
          # stray test.only cannot pass CI and one flake is not a failure.
          CI: 'true'

      # Visual baselines (#217): compare mode. A diff is a layout change;
      # intended ones are accepted with the update-visual-baselines workflow
      # (.github/workflows/README.md).
      - name: Run the extra browser tests
        if: always() && matrix.extra != ''
        run: npm run e2e -- --fully-parallel ${{ matrix.extra }}
        env:
          CI: 'true'

      # It is 36 tests and about 30 seconds, so it runs in the `rest` shard only rather
      # than being split.
      - name: Run visual tests
        if: matrix.name == 'rest'
        run: npm run e2e:visual
        env:
          CI: 'true'

      # The HTML report (with traces of failing tests) is only worth keeping
      # when something failed.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            frontend/playwright-report/
            frontend/playwright-report-visual/
            frontend/test-results-visual/
          retention-days: 14

  # The check people read: it passes only when every shard did. `always()` so a
  # failed or cancelled shard fails this job rather than leaving it skipped.
  e2e:
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard: $SHARDS"
          [ "$SHARDS" = success ]

  # The admin suite (#216): the same run as `npm run e2e:admin` locally, against
  # a throwaway Postgres. Every credential is a dummy: the Playwright config
  # sets the backend's env, and the sign-in test route is only mounted on an
  # http://localhost FRONTEND_URL (config.py refuses to boot otherwise).
  #
  # Split like `e2e` (matrix `e2e-admin-shard`, aggregate `e2e-admin`): the
  # Closet and Denver site specs (about 14 and 12 minutes each, serial) are cut
  # three ways together (`cd-1..3`), and `rest` runs everything else. Each shard
  # has its own runner and so its own Postgres service and joeyhas_e2e
  # database: no shard shares state with another. The Closet, Denver and data
  # specs route their API answers in the page and write nothing, so
  # --fully-parallel is safe for them; admin.spec.js does write to the database
  # but each test makes and deletes its own rows, and its desktop and phone
  # projects already ran concurrently. The sign-in setup test runs in every shard.
  e2e-admin-shard:
    name: e2e-admin-shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cd-1, args: 'admin-closet admin-denver-site admin.setup --shard=1/3', skip: '' }
          - { name: cd-2, args: 'admin-closet admin-denver-site admin.setup --shard=2/3', skip: '' }
          - { name: cd-3, args: 'admin-closet admin-denver-site admin.setup --shard=3/3', skip: '' }
          - { name: rest, args: '', skip: 'admin-closet.spec.js,admin-denver-site.spec.js' }
    services:
      postgres:
        # Same pin as the backend job: Neon's version.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt -c ../backend/constraints.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_DAILY_SALT: ci

      # scripts/e2e-admin-db.mjs creates joeyhaas_e2e and runs alembic; the
      # config then starts uvicorn and `vite preview`. E2E_BACKEND_BIN is the
      # bin directory setup-python put uvicorn and alembic in.
      - name: Run admin browser tests
        run: |
          export E2E_BACKEND_BIN="$(dirname "$(command -v uvicorn)")"
          npm run e2e:admin -- --fully-parallel ${{ matrix.args }}
        env:
          E2E_SKIP_FILES: ${{ matrix.skip }}
          CI: 'true'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-admin-${{ matrix.name }}
          path: frontend/playwright-report-admin/
          retention-days: 14

  e2e-admin:
    needs: [e2e-admin-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every admin e2e shard passed
        env:
          SHARDS: ${{ needs.e2e-admin-shard.result }}
        run: |
          echo "e2e-admin-shard: $SHARDS"
          [ "$SHARDS" = success ]

  # Migration rehearsal (plan task 4): when a PR adds or changes a migration,
  # apply it to a schema-only Neon branch of production and comment the schema
  # diff on the PR. Production's own schema is the starting point, so this
  # catches what an empty CI Postgres cannot (drift between what Neon holds and
  # what the migration assumes). Schema-only: no row of production reaches CI.
  #
  # Inert until the NEON_PROJECT_ID repository variable and NEON_API_KEY secret
  # exist, and skipped for fork PRs (which get no secrets) and for PRs that do
  # not touch backend/migrations/versions. The branch is `pr-<number>`, replaced
  # on each push and deleted by pr-closed.yml when the PR closes; the expiry is
  # a safety net. A schema-only branch is a ROOT branch, and a free project
  # allows three roots (production is one), so two migration PRs can rehearse
  # at once.
  neon-rehearsal:
    if: >-
      vars.NEON_PROJECT_ID != ''
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the schema-diff comment
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: pr-${{ github.event.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does this PR add or change a migration?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" -- backend/migrations/versions | grep -q .; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "expires_at=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration changed; nothing to rehearse."
          fi

      # A fresh branch every push: a migration edited after its first rehearsal
      # must not be judged against the earlier run's leftovers. Deleting a
      # branch that does not exist yet is expected.
      - name: Clear the previous rehearsal branch
        if: steps.changed.outputs.migrations == 'true'
        continue-on-error: true
        # v3.2.1, pinned: this action receives the Neon API key.
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Branch production, schema only
        id: branch
        if: steps.changed.outputs.migrations == 'true'
        # v6, pinned: this action receives the Neon API key.
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          parent_branch: production
          branch_type: schema-only
          expires_at: ${{ steps.changed.outputs.expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # The connection string carries the branch's password.
      - name: Mask the branch URL and require a fresh branch
        if: steps.changed.outputs.migrations == 'true'
        env:
          DB_URL: ${{ steps.branch.outputs.db_url }}
          CREATED: ${{ steps.branch.outputs.created }}
        run: |
          echo "::add-mask::$DB_URL"
          if [ "$CREATED" != "true" ]; then
            echo "::error::$NEON_BRANCH already existed, so it may hold an earlier run's migrations. The clear step failed; check the Neon key and the branch."
            exit 1
          fi

      - uses: actions/setup-python@v7
        if: steps.changed.outputs.migrations == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install dependencies
        if: steps.changed.outputs.migrations == 'true'
        working-directory: backend
        run: pip install -r requirements.txt -c constraints.txt

      # A schema-only branch has production's tables but none of its rows, so
      # alembic_version is empty and Alembic would replay every migration onto
      # tables that exist. Production is at the base branch's head (migrations
      # are applied before the merge), so the branch is stamped there first and
      # only this PR's revisions run.
      - name: Find the base branch's head revision
        id: base
        if: steps.changed.outputs.migrations == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "origin/$BASE_REF"
          heads="$(cd "$RUNNER_TEMP/base/backend" && alembic heads | awk '{print $1}')"
          if [ "$(echo "$heads" | wc -l)" -ne 1 ]; then
            echo "::error::$BASE_REF has more than one migration head: $heads"
            exit 1
          fi
          echo "revision=$heads" >> "$GITHUB_OUTPUT"

      # env.py reads the direct URL only (the pooler cannot run Alembic).
      - name: Apply the migrations to the branch
        if: steps.changed.outputs.migrations == 'true'
        working-directory: backend
        env:
          DATABASE_URL_DIRECT: ${{ steps.branch.outputs.db_url }}
          BASE_REVISION: ${{ steps.base.outputs.revision }}
        run: |
          alembic stamp "$BASE_REVISION"
          alembic upgrade head
          alembic current

      # A schema-only branch is a root branch with no parent, so the base is
      # named: the diff is the branch against production's schema.
      - name: Comment the schema diff
        if: steps.changed.outputs.migrations == 'true'
        # v1.0.1, pinned: this action receives the Neon API key.
        uses: neondatabase/schema-diff-action@80cfa8521628e890015b60f5291a7738926617dc
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          compare_branch: ${{ env.NEON_BRANCH }}
          base_branch: production
          api_key: ${{ secrets.NEON_API_KEY }}
