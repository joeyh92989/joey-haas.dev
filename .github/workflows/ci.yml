name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow reads code and reports status. It needs nothing else, so a
# compromised step has nothing worth taking.
permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant. Cancel it rather than
# paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches PYTHON_VERSION in render.yaml. macOS system Python is 3.9
          # and cannot install this dependency set at all.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint before tests: it is faster, and a formatting failure is cheaper to
      # report than a full test run.
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 entered LTS 2026-08-26 and matches the development machine.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        # High and critical only. A moderate transitive advisory with no patch
        # would otherwise block every unrelated pull request until suppressed,
        # and a gate that must routinely be bypassed stops being a gate.
        run: npm audit --audit-level=high
