name: Snapshot

# Keeps the build-time snapshot of the public collection within a day of
# production. The Render build fetches the snapshot itself
# (frontend/scripts/fetch-snapshot.mjs); this workflow only asks Render to
# rebuild the static site when the live API bodies differ from the deployed
# files. It never pushes: main is protected, and the snapshot is not
# committed.
on:
  schedule:
    # Off the hour: GitHub delays scheduled runs at the top of the hour.
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  SITE_URL: https://joey-haas.dev
  API_URL: https://api.joey-haas.dev

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API
        run: |
          # Each attempt is at most 10 s of curl plus 5 s of sleep, so 24
          # attempts stay inside six minutes and the job's 10-minute limit.
          for attempt in $(seq 1 24); do
            if curl -fsS -m 10 "$API_URL/api/health" > /dev/null; then
              echo "API awake after $attempt attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API did not wake within six minutes"
          exit 1

      - name: Compare the API with the deployed snapshot
        id: compare
        run: |
          # GitHub's default shell is bash -e without pipefail, so a failed
          # curl into jq would leave an empty file and read as "changed".
          # The live side must fail the step; the deployed side is inside an
          # if, where a failure still just means "changed or missing".
          # Both sides are normalised the same way: keys sorted (-S), and
          # arrays sorted, because the API has no unique ordering and a
          # harmless write can reorder tied rows. An array whose elements all
          # have an id is sorted by it. Any other array (Radar's rows have no
          # id) is sorted by each element's serialised text, which orders
          # every element and so leaves no ties to reorder.
          set -o pipefail
          # tostring follows key order in the text, so keys are sorted first.
          normalise='
            def canon:
              if type == "object" then
                to_entries | sort_by(.key)
                | map({key, value: (.value | canon)}) | from_entries
              elif type == "array" then map(canon)
              else . end;
            canon
            | if type == "array" then
                if all(.[]; type == "object" and has("id"))
                then sort_by(.id) else sort_by(tostring) end
              else . end'
          # items and stats are the snapshot; picks and radar are optional
          # because the API can lag behind the static site, and answer 404
          # until it has deployed. A 404 there is skipped with a notice.
          changed=""
          for name in items stats picks radar; do
            live_status=$(curl -sS -m 60 -o "live-$name.raw" -w '%{http_code}' \
              "$API_URL/api/public/$name")
            if [ "$live_status" = 404 ] && [ "$name" != items ] && [ "$name" != stats ]; then
              echo "::notice::$name: the API answered 404, so it is skipped"
              continue
            fi
            if [ "$live_status" != 200 ]; then
              echo "::error::$name: the API answered $live_status"
              exit 1
            fi
            jq -S "$normalise" "live-$name.raw" > "live-$name.json"
            # A missing file is served as index.html, which jq rejects: that
            # counts as changed, so the first run deploys one.
            if curl -fsS -m 60 "$SITE_URL/snapshot/$name.json" -o "deployed-$name.raw" &&
              jq -S "$normalise" "deployed-$name.raw" > "deployed-$name.json" 2> /dev/null &&
              cmp -s "live-$name.json" "deployed-$name.json"; then
              echo "$name: unchanged"
            else
              echo "$name: changed or missing"
              changed="$changed $name"
            fi
          done
          echo "changed=${changed# }" >> "$GITHUB_OUTPUT"

      - name: Trigger a static-site deploy
        if: steps.compare.outputs.changed != ''
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -m 30 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered; changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

      - name: Report no change
        if: steps.compare.outputs.changed == ''
        run: echo "Snapshot unchanged; no deploy" >> "$GITHUB_STEP_SUMMARY"
