name: Deploy API

# Migrates Neon, then deploys the API, in that order and in one place. Replaces
# the old hand step (apply the migration, then merge) and Render's own
# auto-deploy of the API: a failed migration stops here, before any new code is
# live, and the old API keeps running against the unchanged schema.
#
#   push to main -> alembic upgrade head (Neon, direct URL, advisory lock)
#                -> Render deploy hook at this exact commit
#                -> wait until GET /api/version reports this commit
#                -> scripts/smoke.sh (retried once: the static site deploys on
#                   its own clock)
#
# Safety rests on migrations being additive (backend/migrations/README.md): the
# schema is briefly ahead of the live code, and schema_check lets that boot.
#
# Off until the API_DEPLOY_FROM_ACTIONS repository variable is "true", which is
# set together with `autoDeployTrigger: off` on the API in render.yaml (the
# cutover). Until then Render deploys on its own and this would deploy twice.
# A manual run (Run workflow, on main) always works. With no input it deploys
# main's tip like a push. With `commit` it redeploys that EARLIER commit of main
# and runs no migrations: a code rollback that leaves the schema alone (safe
# because migrations are additive), and the way to prove the hook deploys.
#
# Needs secrets DATABASE_URL_DIRECT (Neon's direct, unpooled URL) and
# RENDER_API_DEPLOY_HOOK_URL (the API service's deploy hook, not the static
# site's).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Redeploy this EARLIER commit of main (no migrations run). Leave empty
          to deploy main's tip. It must contain GET /api/version (317b574 or
          later), which the wait reads.
        required: false
        default: ''

permissions:
  contents: read

# Deploys queue and never cancel each other: killing one between the migration
# and the hook would leave the schema ahead of code that was never deployed.
# GitHub keeps only the newest waiting run, which is the right one to deploy
# since it contains the earlier merges and their migrations.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  SITE_URL: https://joey-haas.dev
  API_URL: https://api.joey-haas.dev

jobs:
  deploy:
    # main only, for the manual run too: a run on a feature branch would migrate
    # production and deploy code that was never merged.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.API_DEPLOY_FROM_ACTIONS == 'true')
    runs-on: ubuntu-latest
    # The wait below is at most 60 x (10 s curl + 15 s sleep) = 25 minutes, so
    # its own error fires before this limit does.
    timeout-minutes: 45
    steps:
      # Full history: a requested commit is checked to be an ancestor of main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push deploys the commit that was pushed. A manual run may name an
      # earlier commit of main instead: a code rollback. The schema is never
      # rolled back (migrations are additive), so that path runs none.
      - name: Choose the commit to deploy
        id: target
        env:
          REQUESTED: ${{ inputs.commit }}
        run: |
          if [ -z "$REQUESTED" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "migrate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! sha="$(git rev-parse --verify --quiet "$REQUESTED^{commit}")"; then
            echo "::error::'$REQUESTED' is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
            echo "::error::$sha is not an ancestor of main's tip $GITHUB_SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "migrate=false" >> "$GITHUB_OUTPUT"
          echo "Redeploying $sha (main is at $GITHUB_SHA); migrations will not run."

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -c constraints.txt

      - name: Check the secrets are set
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in DATABASE_URL_DIRECT RENDER_API_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set"
              missing=1
            fi
          done
          exit "$missing"

      # env.py reads the direct URL only: Neon's pooler cannot run Alembic.
      - name: Apply migrations
        if: steps.target.outputs.migrate == 'true'
        working-directory: backend
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          echo "::add-mask::$DATABASE_URL_DIRECT"
          echo "Before:"; alembic current
          alembic upgrade head
          echo "After:"; alembic current

      # `ref` makes Render build exactly this commit, not whatever main is by
      # the time the hook lands.
      - name: Deploy the API at this commit
        env:
          HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          echo "::add-mask::$HOOK_URL"
          case "$HOOK_URL" in *\?*) separator='&' ;; *) separator='?' ;; esac
          response="$(curl -fsS -m 60 -X POST "${HOOK_URL}${separator}ref=${TARGET}")"
          echo "Deploy requested for $TARGET; Render answered: $response"

      # /api/health answers the same from the old instance and the new one, so
      # the commit is what says the new build is the one serving. A free
      # instance cold-starts slowly, hence the generous wait.
      - name: Wait for the new build
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            live="$(curl -s -m 10 "$API_URL/api/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')"
            echo "attempt $attempt: live commit '${live:-none}'"
            if [ "$live" = "$TARGET" ]; then
              echo "The API is serving $TARGET"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The API was not serving $TARGET within 25 minutes. Any migration is applied (additive, safe ahead of the code); see the Render deploy log, and roll back per CLAUDE.md -> Ship if the deploy failed."
          exit 1

      - name: Smoke test
        run: |
          if ! ./scripts/smoke.sh "$SITE_URL" "$API_URL"; then
            echo "Smoke failed; retrying once in 3 minutes (the static site deploys separately)."
            sleep 180
            ./scripts/smoke.sh "$SITE_URL" "$API_URL"
          fi
